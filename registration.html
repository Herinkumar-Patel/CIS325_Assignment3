<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="form-container">
        <h2>User Registration</h2>

        <form id="registrationForm" novalidate>

            <label>First Name</label>
            <input type="text" id="firstName" />
            <small class="error" id="firstNameError"></small>

            <label>Last Name</label>
            <input type="text" id="lastName" />
            <small class="error" id="lastNameError"></small>

            <label>Email</label>
            <input type="email" id="email" />
            <small class="error" id="emailError"></small>

            <label>Password</label>
            <input type="password" id="password" />
            <small class="error" id="passwordError"></small>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" />
            <small class="error" id="confirmPasswordError"></small>

            <label>Age (Optional)</label>
            <input type="number" id="age" />
            <small class="error" id="ageError"></small>

            <label>Phone Number (Optional)</label>
            <input type="text" id="phoneNumber" placeholder="123-456-7890" />
            <small class="error" id="phoneError"></small>

            <button type="submit">Submit</button>
        </form>

        <a class="link-btn" href="index.html">Back to Growth Page</a>
    </div>

    <script src="script.js"></script>
</body>

</html>
